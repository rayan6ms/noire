name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/noire-ci-logs"
          rustup toolchain install 1.97.0 --profile minimal \
            --component clippy,rustfmt --no-self-update \
            2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/toolchain.log"

      - name: Restore Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo +1.97.0 fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/format.log"

      - name: Check workspace with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo +1.97.0 check --workspace --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/check.log"

      - name: Run Clippy with warnings denied
        run: cargo +1.97.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/clippy.log"

      - name: Run unit and documentation tests
        run: cargo +1.97.0 test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/test.log"

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.97.0 doc --workspace --no-deps --locked 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/docs.log"

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/upload-failure-evidence
        with:
          artifact-name: ci-failure-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

  supply-chain:
    name: Supply chain and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/noire-ci-logs"
          rustup toolchain install 1.97.0 --profile minimal --no-self-update \
            2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/toolchain.log"

      - name: Install verified policy tools
        run: |
          {
            tool_dir="$RUNNER_TEMP/noire-policy-tools"
            bin_dir="$tool_dir/bin"
            mkdir -p "$bin_dir"

            deny_archive="$tool_dir/cargo-deny.tar.gz"
            curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error \
              --location --output "$deny_archive" \
              "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
            printf '%s  %s\n' "$CARGO_DENY_SHA256" "$deny_archive" | sha256sum --check --strict
            tar -xzf "$deny_archive" -C "$tool_dir"
            install -m 0755 \
              "$tool_dir/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny" \
              "$bin_dir/cargo-deny"

            audit_archive="$tool_dir/cargo-audit.tar.gz"
            curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error \
              --location --output "$audit_archive" \
              "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v$CARGO_AUDIT_VERSION/cargo-audit-x86_64-unknown-linux-musl-v$CARGO_AUDIT_VERSION.tgz"
            printf '%s  %s\n' "$CARGO_AUDIT_SHA256" "$audit_archive" | sha256sum --check --strict
            tar -xzf "$audit_archive" -C "$tool_dir"
            install -m 0755 \
              "$tool_dir/cargo-audit-x86_64-unknown-linux-musl-v$CARGO_AUDIT_VERSION/cargo-audit" \
              "$bin_dir/cargo-audit"

            printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          } 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/policy-tools.log"

      - name: Check dependency policy
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: cargo-deny --locked check 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/cargo-deny.log"

      - name: Audit the locked dependency graph
        run: cargo-audit audit --deny warnings --file Cargo.lock 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/cargo-audit.log"

      - name: Enforce the empty unsafe allowlist
        run: |
          {
            if grep --recursive --line-number --word-regexp \
              --include='*.rs' unsafe crates; then
              echo "unsafe Rust requires an explicit SECURITY.md allowlist entry" >&2
              exit 1
            fi
          } 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/unsafe-policy.log"

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/upload-failure-evidence
        with:
          artifact-name: ci-failure-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

  msrv:
    name: MSRV 1.92
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MSRV toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/noire-ci-logs"
          rustup toolchain install 1.92.0 --profile minimal --no-self-update \
            2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/toolchain.log"

      - name: Restore Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Check workspace on MSRV
        env:
          RUSTFLAGS: -D warnings
        run: cargo +1.92.0 check --workspace --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/msrv-check.log"

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/upload-failure-evidence
        with:
          artifact-name: ci-failure-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

  release:
    name: Release build and binary smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/noire-ci-logs"
          rustup toolchain install 1.97.0 --profile minimal --no-self-update \
            2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/toolchain.log"

      - name: Restore Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Build release workspace
        run: cargo +1.97.0 build --workspace --release --locked 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/release-build.log"

      - name: Smoke-test binary interfaces
        run: |
          {
            test "$(target/release/noired --version)" = "noired 0.1.0"
            test "$(target/release/noire --version)" = "noire 0.1.0"
            test "$(target/release/noirectl --version)" = "noirectl 0.1.0"
            target/release/noired --help >/dev/null
            target/release/noire --help >/dev/null
            target/release/noirectl --help >/dev/null
          } 2>&1 | tee "$RUNNER_TEMP/noire-ci-logs/release-smoke.log"

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: ./.github/actions/upload-failure-evidence
        with:
          artifact-name: ci-failure-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

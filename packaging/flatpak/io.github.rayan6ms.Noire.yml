app-id: io.github.rayan6ms.Noire
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: noire-wrapper
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.systemd1
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=io.github.rayan6ms.Noire.Noire1
modules:
  - name: noire
    buildsystem: simple
    build-options:
      prepend-path: /usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
      build-args:
        - --share=network
    build-commands:
      - mkdir -p rust-toolchain-source rust-toolchain
      - tar -xJf rust-1.97.0-x86_64-unknown-linux-gnu.tar.xz -C rust-toolchain-source --strip-components=1
      - rust-toolchain-source/install.sh --prefix="$PWD/rust-toolchain" --without=rust-docs
      - PATH="$PWD/rust-toolchain/bin:$PATH" cargo build --locked --release --package noired --package noirectl --package noire-ui
      - install -Dm755 target/release/noire /app/bin/noire
      - install -Dm755 target/release/noired /app/bin/noired
      - install -Dm755 target/release/noirectl /app/bin/noirectl
      - install -Dm755 packaging/flatpak/noire-wrapper /app/bin/noire-wrapper
      - install -Dm644 data/applications/io.github.rayan6ms.Noire.desktop /app/share/applications/io.github.rayan6ms.Noire.desktop
      - sed -i 's/^Exec=noire$/Exec=noire-wrapper/' /app/share/applications/io.github.rayan6ms.Noire.desktop
      - install -Dm644 data/metainfo/io.github.rayan6ms.Noire.metainfo.xml /app/share/metainfo/io.github.rayan6ms.Noire.metainfo.xml
      - install -Dm644 icons/noire.svg /app/share/icons/hicolor/scalable/apps/io.github.rayan6ms.Noire.svg
    sources:
      - type: dir
        path: ../..
      - type: file
        url: https://static.rust-lang.org/dist/2026-07-09/rust-1.97.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: 1cf17e4905b841d4c8e3f76467ac148d55fb3f54bf213c86f0d287a36471d904

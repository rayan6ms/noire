schema_version = 1

[[template]]
id = "AT-GTK-UI"
kind = "automated"
status = "active"
phase = 8
owner = "rayan6ms"
requirements = ["FR-011"]
observable = "The GTK4 UI exposes settings, status, subscribed meters, sanitized diagnostics, offline help, About/license metadata, and a validated AppStream screenshot captured from the real package; consumes daemon state/device signals instead of polling snapshots; survives missing daemon/audio state; and performs daemon I/O asynchronously."
test_ids = ["T-GTK-SETTINGS-STATUS"]
commands = ["cargo test --package noire-ui --features gtk-ui --locked", ".github/scripts/run_phase8_ui_smoke.sh", "NOIRE_PHASE8_DISPOSABLE_VM=1 .github/scripts/run_phase8_packaged_ui_vm.sh <deb|rpm> <package-dir>", "NOIRE_PHASE8_SCREENSHOT_VM=1 .github/scripts/capture_phase8_appstream_screenshot.sh <deb-package-dir> data/screenshots/noire-overview.png", "python3 .github/scripts/validate_appstream_screenshots.py data/metainfo/io.github.rayan6ms.Noire.metainfo.xml ."]
fixtures = ["Healthy, pending, degraded, disconnected, rejected, signal-driven external-change, and capped-reconnect daemon states", "Subscribed, unsubscribed, and second-client meter streams", "Sanitized diagnostic report and locally installed help URIs"]
environments = ["Headless state runner and disposable Xvfb GTK session", "Packaged Ubuntu 24.04, Debian 13, Fedora 43, and Fedora 44 containers"]
result_artifacts = ["Widget state, action availability, signal/reconnect convergence, targeted 10 Hz meter subscription, sanitized diagnostic rendering, help/About metadata, reproducible translation template, responsiveness, and crash assertions", "GTK-free headless install, private D-Bus operation, GTK 4.10 floor, explicit no-display failure, bounded Xvfb runtime, process cleanup, and post-UI-removal headless assertions", "Actual packaged running-state GTK window on a 1280x720 AppStream source canvas with local URL, PNG header, declared-dimension, and 16:9 assertions"]
sources = ["crates/noire-ui/src/app.rs::fn widget_state_matrix_tracks_daemon_truth_and_accessible_controls", "crates/noire-ui/src/app.rs::fn diagnostic_report_text", "crates/noire-ui/src/app.rs::fn about_dialog", "crates/noire-ui/src/client.rs::async fn serve_connection", "crates/noire-ui/src/client.rs::Request::Diagnostics", "crates/noired/src/service.rs::pub async fn monitor", "crates/noire-ui/src/i18n.rs::pub(crate) fn tr", "po/update-pot.sh::xgettext", ".github/scripts/run_phase8_ui_smoke.sh::NOIRE_PHASE8_UI signals=pass meters=bounded-subscribed-pass reconnect=capped-pass diagnostics=pass help=pass about=pass i18n=pass accessibility=automated-pass daemon_absence=pass", ".github/scripts/run_phase8_packaged_ui_vm.sh::NOIRE_PHASE8_PACKAGED_UI family=$family", ".github/scripts/capture_phase8_appstream_screenshot.sh::NOIRE_PHASE8_APPSTREAM_SCREENSHOT package=deb state=running dimensions=$dimensions capture=actual-window", ".github/scripts/validate_appstream_screenshots.py::NOIRE_APPSTREAM_SCREENSHOTS count={checked} local=pass dimensions=pass ratio=16:9"]

[[template]]
id = "MX-ACCESSIBILITY"
kind = "mixed"
status = "waived"
phase = 8
owner = "rayan6ms"
requirements = ["FR-011", "NFR-010"]
observable = "All controls are keyboard-operable and labeled, state never relies on color alone, and a screen reader exposes meaningful names and changes."
test_ids = ["T-GTK-ACCESSIBILITY-TREE"]
commands = [".github/scripts/run_phase8_ui_smoke.sh", ".github/scripts/run_phase8_accessibility_preflight.sh", "Complete tests/usability/phase8-accessibility-review.md on GNOME Wayland, KDE Wayland, and one available X11 session"]
fixtures = ["Every interactive control and healthy/degraded status presentation", "RTL direction with HighContrast at 200% scale"]
environments = ["Automated Xvfb/X11 and headless Weston/Wayland preflight", "GNOME Wayland, KDE Wayland, and one available X11 test session"]
result_artifacts = ["Accessibility-tree and display-backend preflight report", "Signed keyboard/screen-reader checklist"]
manual_reason = "Assistive-technology speech output and end-to-end keyboard usability require human review beyond machine inspection of the accessibility tree."
manual_fields = ["reviewer", "date", "desktop", "screen reader", "keyboard path", "spoken labels", "color independence"]
sources = ["crates/noire-ui/src/app.rs::fn accessibility_tree_and_keyboard_paths_are_complete", "crates/noire-ui/src/app.rs::fn rtl_high_contrast_scaled_layout_remains_operable", ".github/scripts/run_phase8_ui_smoke.sh::app::tests::accessibility_tree_and_keyboard_paths_are_complete", ".github/scripts/run_phase8_accessibility_preflight.sh::NOIRE_PHASE8_ACCESSIBILITY_PREFLIGHT", "tests/usability/phase8-accessibility-review.md::Keyboard path", "tests/release/qualification-decision-1.0.0.toml::waived_evidence"]

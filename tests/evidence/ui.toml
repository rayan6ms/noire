schema_version = 1

[[template]]
id = "AT-GPUI-UI"
kind = "automated"
status = "active"
phase = 8
owner = "rayan6ms"
requirements = ["FR-011"]
observable = "The GPUI application exposes a focused dark home screen, a separate settings screen, subscribed meters, daemon-owned settings, privacy-safe diagnostics, saved start-minimized and close-to-tray preferences, and a freedesktop system tray without performing daemon I/O on the GPUI thread."
test_ids = ["T-GPUI-SETTINGS-STATUS"]
commands = ["cargo check --package noire-ui --locked", "cargo test --package noire-ui --locked", "packaging/appimage/build.sh <version> x86_64 <binary-dir> <output-dir>"]
fixtures = ["Healthy, pending, degraded, disconnected, rejected, signal-driven external-change, and capped-reconnect daemon states", "Saved desktop preferences and tray commands", "Sanitized diagnostic report"]
environments = ["Headless state tests", "Fedora Wayland and X11 GPUI build", "Local x86_64 AppImage"]
result_artifacts = ["State and D-Bus worker tests", "Locally launchable AppImage with GPUI, daemon, CLI, desktop metadata, and tray support"]
sources = ["crates/noire-ui/src/app.rs::impl Render for NoireView", "crates/noire-ui/src/client.rs::async fn serve_connection", "crates/noire-ui/src/preferences.rs::pub(crate) struct DesktopPreferences", "crates/noire-ui/src/tray.rs::pub(crate) struct TrayRuntime", "packaging/appimage/build.sh::NOIRE_APPIMAGETOOL"]


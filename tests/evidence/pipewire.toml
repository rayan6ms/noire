environments = ["Disposable Ubuntu 24.04 PipeWire 1.0.5 and WirePlumber 0.4.17 session"]
result_artifacts = ["NOIRE_PIPEWIRE_RESULT callback/format/error/RSS counters", "tests/performance/phase3-capture.toml"]
sources = ["crates/noire-pipewire/tests/native_session.rs::fn captures_deterministic_44100_source_as_canonical_48000", "crates/noire-pipewire/tests/native_session.rs::NOIRE_PIPEWIRE_TEST_SECONDS", "crates/noire-pipewire/tests/capture_allocation.rs::fn warmed_capture_processing_has_zero_allocator_calls", "crates/noire-pipewire/src/capture.rs::fn generation_reset_clears_all_input_local_state_before_new_samples"]


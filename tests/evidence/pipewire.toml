phase = 3
owner = "rayan6ms"
requirements = ["FR-004", "NFR-005"]
observable = "A real native capture stream receives deterministic finite mono audio from a 44.1 kHz synthetic source as canonical F32/48 kHz, rejects malformed callback storage without panic, resets generation-local state at the callback boundary, and reports bounded counters without callback logging or allocation."
test_ids = ["T-PW-CAPTURE-SESSION"]
commands = ["cargo test -p noire-pipewire --locked", "NOIRE_PIPEWIRE_TEST_SECONDS=3600 dbus-run-session -- .github/scripts/run_pipewire_session.sh"]

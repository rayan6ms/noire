[[template]]
id = "MX-APPLICATION-COMPAT"
kind = "mixed"
status = "planned"
phase = 10
owner = "rayan6ms"
requirements = ["NFR-009", "QG-008"]
observable = "Every required application can select the single Noire source and capture intelligible speech on the supported release matrix."
test_ids = ["T-RELEASE-APPLICATION-MATRIX"]
commands = ["Run source-selection and capture scenarios for every required application and recorder API"]

schema_version = 1

[[template]]
id = "AT-MODEL-PERFORMANCE"
kind = "automated"
status = "active"
phase = 2
owner = "rayan6ms"
requirements = ["FR-006", "NFR-005"]
observable = "An instrumented allocator reports zero allocation/reallocation/deallocation calls across warmed production DSP and model processing, every bounded DSP stage has a Criterion benchmark, and 20,000 release model frames meet the 0.75 ms p99 reference-host gate."
test_ids = ["T-MODEL-ALLOCATION-P99"]
commands = ["cargo test -p noire-model-rnnoise --test allocation --features rnnoise --release --locked", "cargo bench -p noire-dsp --bench dsp_stages --locked", "cargo bench -p noire-model-rnnoise --bench model_frame --features rnnoise --locked"]
fixtures = ["Deterministic 480-sample tones, stereo coherent input, warmed embedded-default RNNoise state, and every bounded DSP stage"]
environments = ["Pinned Rust release profile on the recorded x86_64 reference host; no PipeWire, UI, device, file, or network dependency"]
result_artifacts = ["tests/performance/phase2-model.toml with allocation counts, DSP Criterion estimates, 20,000-frame p99, commands, and environment"]
sources = ["crates/noire-model-rnnoise/tests/allocation.rs::fn warmed_dsp_and_model_processing_allocate_nothing", "crates/noire-model-rnnoise/benches/model_frame.rs::P99_LIMIT", "crates/noire-dsp/benches/dsp_stages.rs::fn dsp_stages", "tests/performance/phase2-model.toml::p99_microseconds = 160.629"]

[[template]]
id = "AT-REALTIME-PERFORMANCE"
kind = "automated"
status = "planned"
phase = 7
owner = "rayan6ms"
requirements = ["NFR-001", "NFR-002", "NFR-005"]
observable = "Reference-host latency and CPU percentiles meet thresholds while callback instrumentation reports no allocation, wait, lock, I/O, or unbounded work."
test_ids = ["T-RT-LATENCY-CPU-CALLBACK"]
commands = ["Run the pinned loopback latency, CPU accounting, allocation, and callback audit procedures"]
fixtures = ["128-frame and 256-frame reference audio workloads"]
environments = ["Recorded x86_64 reference hardware and PipeWire configuration"]
result_artifacts = ["Raw samples, percentile report, process accounting, and callback audit result"]

[[template]]
id = "AT-IDLE-RESOURCE"
kind = "automated"
status = "planned"
phase = 7
owner = "rayan6ms"
requirements = ["NFR-003", "NFR-004"]
observable = "No-consumer idle CPU and ten-minute daemon/UI RSS remain below their release thresholds."
test_ids = ["T-IDLE-CPU-MEMORY"]
commands = ["Run the pinned idle CPU and RSS sampling procedures"]
fixtures = ["No-consumer daemon state and open-UI steady state"]
environments = ["Recorded x86_64 reference hardware"]
result_artifacts = ["Timestamped CPU and RSS samples with percentile and maximum summaries"]

[[template]]
id = "AT-RECOVERY-SOAK"
kind = "automated"
status = "planned"
phase = 7
owner = "rayan6ms"
requirements = ["NFR-003", "NFR-004", "NFR-006", "NFR-007", "NFR-008"]
observable = "The 24-hour workload and mandatory recovery cycles finish without crash, attributable xrun, unbounded counters, missed deadlines, or excessive RSS growth."
test_ids = ["T-RELEASE-RECOVERY-SOAK"]
commands = ["Run the 24-hour soak with scheduled hotplug and PipeWire restart scenarios"]
fixtures = ["Continuous deterministic source, consumer, hotplug, and restart schedule"]
environments = ["Approved disposable reference-host session"]
result_artifacts = ["Timestamped health, xrun, counter, recovery, CPU, and RSS time series"]

[[template]]
id = "AT-PRIVACY-BOUNDARY"
kind = "automated"
status = "planned"
phase = 7

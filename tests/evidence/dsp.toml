[[template]]
id = "MX-SPEECH-PRESERVATION"
kind = "mixed"
status = "planned"
phase = 2
owner = "rayan6ms"
requirements = ["FR-006", "QG-004"]
observable = "Objective metrics meet STOI/clipping thresholds and at least three blinded reviewers find no majority missing-word failure."
test_ids = ["T-DSP-SPEECH-PRESERVATION"]
commands = ["Run the pinned offline quality harness and blinded listening protocol"]
fixtures = ["Frozen clean-speech corpus and deterministic level-matched listening bundle"]
environments = ["Pinned offline quality environment", "Independent blinded listening sessions"]
result_artifacts = ["STOI/clipping JSON report and signed concealed-key listening record"]
manual_reason = "Missing words, musical noise, and perceived distortion require blinded human listening; objective metrics alone cannot establish those outcomes."
manual_fields = ["reviewer identifier", "review date", "randomized answers", "missing-word judgment", "concealed-key verification"]


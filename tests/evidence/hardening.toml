schema_version = 1

[[template]]
id = "AT-FUZZ-HARDENING"
kind = "automated"
status = "active"
phase = 7
owner = "rayan6ms"
requirements = ["FR-006", "FR-008", "FR-010"]
observable = "Generated arbitrary config/migration documents, model-manifest arithmetic, bounded audio chunks, and recovery event/clock sequences never panic, escape validation, lose samples, or violate capped scheduling invariants."
test_ids = ["T-FUZZ-STATE-INPUTS"]
commands = ["cargo test --release -p noire-config -p noire-model -p noire-dsp -p noired --lib --locked"]
fixtures = ["4,096 cases each for arbitrary config strings/migrations, model descriptor tuples, audio chunks, and recovery event sequences containing up to 4,096 events"]
environments = ["Pinned Rust release tests with deterministic proptest regression persistence"]
result_artifacts = ["Generated case counts, minimized failures if any, and tests/performance/phase7-hardening.toml"]
sources = ["crates/noire-config/src/lib.rs::fn arbitrary_config_documents_never_panic_or_escape_validation", "crates/noire-model/src/descriptor.rs::fn arbitrary_manifest_numbers_are_rejected_or_bounded", "crates/noire-dsp/src/frame.rs::fn randomized_chunks_conserve_every_sample", "crates/noired/src/recovery.rs::fn arbitrary_fault_and_clock_sequences_remain_bounded"]


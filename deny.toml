[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []
unused-ignored-advisory = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
highlight = "simplest-path"
skip = [
    { crate = "getrandom@0.3.4", reason = "proptest's rand stack has not converged on getrandom 0.4" },
    { crate = "nom@7.1.3", reason = "PipeWire's bindgen build dependency still uses nom 7" },
    { crate = "shlex@1.3.0", reason = "PipeWire's bindgen build dependency still uses shlex 1" },
    { crate = "syn@2.0.119", reason = "GTK and D-Bus macros have not all converged on syn 3" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

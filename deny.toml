[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# GPUI 0.2.2 currently carries these unmaintained-only advisories in its
# transitive rendering/HTTP stack. None report a vulnerability or unsoundness;
# keep the IDs explicit so a GPUI upgrade can remove them deliberately.
ignore = [
    "RUSTSEC-2024-0436", # paste, through image/rav1e
    "RUSTSEC-2025-0052", # async-std, through gpui_http_client
    "RUSTSEC-2025-0134", # rustls-pemfile, through gpui_http_client
    "RUSTSEC-2026-0173", # proc-macro-error2, through stacksafe
    "RUSTSEC-2026-0192", # ttf-parser, through GPUI font rendering
    "RUSTSEC-2026-0206", # rustybuzz, through GPUI font rendering
]
unused-ignored-advisory = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
highlight = "simplest-path"
skip-tree = [
    { crate = "gpui@0.2.2", reason = "GPUI controls its rendering and platform dependency generations" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

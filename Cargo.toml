[workspace]
members = [
    "crates/noire-config",
    "crates/noire-core",
    "crates/noire-dsp",
    "crates/noire-ipc",
    "crates/noire-model",
    "crates/noire-model-rnnoise",
    "crates/noire-pipewire",
    "crates/noire-test-support",
    "crates/noire-ui",
    "crates/noirectl",
    "crates/noired",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["rayan6ms"]
repository = "https://github.com/rayan6ms/noire"
homepage = "https://github.com/rayan6ms/noire"

[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
criterion = "=0.8.2"
gtk4 = { version = "=0.11.4", default-features = false, features = ["v4_10"] }
hound = "=3.5.1"
libspa = "=0.10.0"
nnnoiseless = { version = "=0.5.2", default-features = false }
noire-config = { version = "=0.1.0", path = "crates/noire-config" }
noire-core = { version = "=0.1.0", path = "crates/noire-core" }
noire-dsp = { version = "=0.1.0", path = "crates/noire-dsp" }
noire-ipc = { version = "=0.1.0", path = "crates/noire-ipc" }
noire-model = { version = "=0.1.0", path = "crates/noire-model" }
noire-model-rnnoise = { version = "=0.1.0", path = "crates/noire-model-rnnoise" }
noire-pipewire = { version = "=0.1.0", path = "crates/noire-pipewire" }
pipewire = "=0.10.0"
proptest = "=1.11.0"
rtrb = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
stats_alloc = "=0.1.10"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

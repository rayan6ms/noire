[workspace]
members = [
    "crates/noire-config",
    "crates/noire-core",
    "crates/noire-dsp",
    "crates/noire-ipc",
    "crates/noire-model",
    "crates/noire-model-fastenhancer",
    "crates/noire-model-fastenhancer-sys",
    "crates/noire-model-rnnoise",
    "crates/noire-pipewire",
    "crates/noire-test-support",
    "crates/noire-ui",
    "crates/noirectl",
    "crates/noired",
]
resolver = "3"

[workspace.package]
version = "1.1.13"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["rayan6ms"]
repository = "https://github.com/rayan6ms/noire"
homepage = "https://github.com/rayan6ms/noire"

[workspace.dependencies]
anyhow = "=1.0.104"
cc = "=1.4.2"
clap = { version = "=4.6.6", features = ["derive"] }
criterion = "=0.8.2"
futures-util = "=0.3.33"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
hound = "=3.5.1"
ksni = { version = "=0.3.5", default-features = false, features = ["blocking", "tokio"] }
libspa = "=0.10.0"
nnnoiseless = { version = "=0.5.2", default-features = false }
noire-config = { version = "=1.1.13", path = "crates/noire-config" }
noire-core = { version = "=1.1.13", path = "crates/noire-core" }
noire-dsp = { version = "=1.1.13", path = "crates/noire-dsp" }
noire-ipc = { version = "=1.1.13", path = "crates/noire-ipc" }
noire-model = { version = "=1.1.13", path = "crates/noire-model" }
noire-model-fastenhancer = { version = "=1.1.13", path = "crates/noire-model-fastenhancer" }
noire-model-fastenhancer-sys = { version = "=1.1.13", path = "crates/noire-model-fastenhancer-sys" }
noire-model-rnnoise = { version = "=1.1.13", path = "crates/noire-model-rnnoise" }
noire-pipewire = { version = "=1.1.13", path = "crates/noire-pipewire" }
noired = { version = "=1.1.13", path = "crates/noired", default-features = false }
pipewire = "=0.10.0"
proptest = "=1.11.0"
rtrb = "=0.3.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
stats_alloc = "=0.1.10"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

# The crates.io 0.10.0 sys crates need upstream commit 9b54509's bindgen
# fallback output-directory fix on Ubuntu 24.04. Keep these local patches
# auditable and free of release-branch Git dependencies; see vendor/README.md.
[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }
libspa-sys = { path = "vendor/libspa-sys-0.10.0" }
pipewire-sys = { path = "vendor/pipewire-sys-0.10.0" }

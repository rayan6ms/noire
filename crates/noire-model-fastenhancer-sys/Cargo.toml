[package]
name = "noire-model-fastenhancer-sys"
description = "Private native FastEnhancer inference bindings for Noire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
links = "fastenhancer"

[build-dependencies]
cc.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

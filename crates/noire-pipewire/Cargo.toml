[package]
name = "noire-pipewire"
description = "PipeWire registry, stream, and graph adapter for Noire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libspa = { workspace = true, optional = true }
noire-core.workspace = true
noire-dsp.workspace = true
noire-model.workspace = true
pipewire = { workspace = true, optional = true, features = ["v0_3_49"] }
rtrb.workspace = true

[dev-dependencies]
noire-model-fastenhancer.workspace = true
stats_alloc.workspace = true

[features]
default = []
native-test = ["pipewire-backend"]
pipewire-backend = ["dep:libspa", "dep:pipewire"]

[lints]
workspace = true

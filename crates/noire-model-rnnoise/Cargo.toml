[package]
name = "noire-model-rnnoise"
description = "RNNoise model adapter for Noire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hound = { workspace = true, optional = true }
nnnoiseless = { workspace = true, optional = true }
noire-model.workspace = true

[dev-dependencies]
noire-dsp.workspace = true

[features]
default = []
offline-wav = ["rnnoise", "dep:hound"]
rnnoise = ["dep:nnnoiseless"]

[[bin]]
name = "noire-denoise-wav"
path = "src/bin/noire-denoise-wav.rs"
required-features = ["offline-wav"]

[lints]
workspace = true
